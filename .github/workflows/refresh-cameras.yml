name: Camera Data Refresh

on:
  schedule:
    # Run weekly on Sunday at 6am UTC (2am ET)
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      states:
        description: 'Specific states to refresh (space-separated, empty = all)'
        required: false
        default: ''
      api_only:
        description: 'Skip states that need Playwright'
        required: false
        type: boolean
        default: false
      check_only:
        description: 'Health check only (no data refresh)'
        required: false
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install httpx playwright
          playwright install chromium

      - name: Health check
        if: inputs.check_only == true || github.event_name == 'schedule'
        run: |
          python3 scripts/refresh-all.py --check || true
        continue-on-error: true

      - name: Refresh camera data
        id: refresh
        if: inputs.check_only != true
        run: |
          ARGS=""
          if [ -n "${{ inputs.states }}" ]; then
            ARGS="${{ inputs.states }}"
          fi
          if [ "${{ inputs.api_only }}" = "true" ]; then
            ARGS="$ARGS --api-only"
          fi
          # Partial failures no longer fail the job (refresh-all exits 0 unless
          # every attempted state fails). Capture any failed-states summary so
          # the PR body can flag it. tee preserves the live log + exit code.
          set -o pipefail
          python3 scripts/refresh-all.py $ARGS 2>&1 | tee refresh.log
          # The script prints one annotation line "::warning title=...::<summary>"
          # when any state failed; pull the summary after the last "::". The
          # `|| true` keeps a no-match grep (the all-succeeded case) from
          # aborting the step under `set -e`.
          FAILED=$(grep '^::warning title=Camera refresh' refresh.log | sed 's/.*:://' | head -1 || true)
          {
            echo "failed<<EOF"
            echo "$FAILED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Rebuild database
        if: inputs.check_only != true
        run: python3 scripts/build-db.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create PR with updated data
        if: steps.changes.outputs.changed == 'true' && inputs.check_only != true
        run: |
          rm -f refresh.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/camera-refresh-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: refresh camera data $(date +%Y-%m-%d)

          Automated weekly refresh from live data sources.
          Run by: ${{ github.event_name }}"
          git push origin "$BRANCH"
          WARNING=""
          if [ -n "$REFRESH_FAILED" ]; then
            WARNING="

          > [!WARNING]
          > Some states failed to refresh and are **not** updated in this PR (their last-good data is retained): $REFRESH_FAILED"
          fi
          # @-mention + reviewer request both make the maintainer a participant,
          # so a bot-authored PR actually sends a notification.
          PR_URL=$(gh pr create \
            --title "chore: refresh camera data $(date +%Y-%m-%d)" \
            --body "Automated camera data refresh from live sources.

          **Trigger:** ${{ github.event_name }}
          **Changes:** $(git diff --stat HEAD~1 | tail -1)
          $WARNING

          Review the diff to confirm no data corruption, then merge.

          cc @${REVIEWER}" \
            --base main)
          echo "Opened $PR_URL"
          # Non-fatal: a reviewer-request hiccup must not fail the job.
          gh pr edit "$PR_URL" --add-reviewer "$REVIEWER" || echo "reviewer request skipped"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_FAILED: ${{ steps.refresh.outputs.failed }}
          REVIEWER: bobbyearl
