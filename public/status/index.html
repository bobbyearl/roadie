<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadie Status</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 1rem; }
    h1 { margin-bottom: 0.5rem; font-size: 1.25rem; }
    .subtitle { color: #888; font-size: 0.75rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.75rem; }
    .card { background: #2a2a3e; border-radius: 0.5rem; overflow: hidden; border: 1px solid #333; }
    .card-header { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.6rem; font-size: 0.7rem; }
    .card-state { font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .card-status { padding: 1px 6px; border-radius: 9px; font-size: 0.6rem; font-weight: 600; }
    .card-status.ok { background: #22c55e33; color: #4ade80; }
    .card-status.fail { background: #ef444433; color: #f87171; }
    .card-status.loading { background: #eab30833; color: #fbbf24; }
    .card-status.offline { background: #64748b33; color: #94a3b8; }
    .card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #111; display: block; }
    .card-name { padding: 0.3rem 0.6rem; font-size: 0.6rem; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; }
    .card-source { color: #94a3b8; text-decoration: none; font-size: 0.55rem; shrink: 0; }
    .card-source:hover { color: #e0e0e0; text-decoration: underline; }
    .card-app-link { color: #aaa; text-decoration: none; overflow: hidden; text-overflow: ellipsis; }
    .card-app-link:hover { color: #e0e0e0; text-decoration: underline; }
    .summary { margin-top: 1rem; font-size: 0.7rem; color: #888; }
    .ts { color: #666; }
    .title-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .title-row h1 { margin: 0; }
    .agg-badge { padding: 3px 10px; border-radius: 9px; font-size: 0.7rem; font-weight: 600; }
    .agg-badge.checking { background: #eab30833; color: #fbbf24; }
    .agg-badge.good { background: #22c55e33; color: #4ade80; }
    .agg-badge.degraded { background: #f9731633; color: #fb923c; }
    .agg-badge.down { background: #ef444433; color: #f87171; }
    .controls { margin-bottom: 0.75rem; }
    .mode-toggle { display: inline-flex; border-radius: 0.375rem; overflow: hidden; border: 1px solid #555; font-size: 0.7rem; }
    .mode-toggle button { padding: 0.3rem 0.75rem; border: none; cursor: pointer; background: #333; color: #999; transition: background 0.15s, color 0.15s; }
    .mode-toggle button.active { background: #2563eb; color: #fff; }
    .card-video { width: 100%; aspect-ratio: 16/9; background: #111; display: block; }
    .card-no-video { width: 100%; aspect-ratio: 16/9; background: #111; display: flex; align-items: center; justify-content: center; color: #555; font-size: 0.65rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
  <div class="title-row">
    <h1>Roadie Camera Status</h1>
    <span class="agg-badge checking" id="agg">Checking...</span>
  </div>
  <p class="subtitle">One test camera per state. Verifies feeds are accessible.</p>
  <div class="controls">
    <div class="mode-toggle">
      <button id="modeImg" class="active" onclick="setMode('image')">Images</button>
      <button id="modeVid" onclick="setMode('video')">Video</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="summary" id="summary"></p>

  <script>
    const cameras = [
      { state: 'AK', id: 'ak:1', name: 'Seward Hwy @ Portage Glacier Rd', url: 'https://511.alaska.gov/map/Cctv/1', source: 'https://511.alaska.gov' },
      { state: 'AL', id: 'al:1845', name: 'I-10 East @ McDonald Rd', url: 'https://api.algotraffic.com/v4/Cameras/1845/snapshot.jpg', source: 'https://algotraffic.com' },
      { state: 'CA', id: 'ca:d1_1', name: 'SR-20 at SR-1 (Fort Bragg)', url: 'https://cwwp2.dot.ca.gov/data/d1/cctv/image/sr20atsr1lookingeast/sr20atsr1lookingeast.jpg', source: 'https://cwwp2.dot.ca.gov' },
      { state: 'CT', id: 'ct:308', name: 'Vernon I-84 WB Exit 64', url: 'https://ctroads.org/map/Cctv/308', source: 'https://ctroads.org' },
      { state: 'DE', id: 'de:KCAM001', name: 'DE 1 @ Milford Neck Rd', url: 'https://video.deldot.gov/live/KCAM001.stream/playlist.m3u8', note: 'video-only (HLS)', source: 'https://deldot.gov/map' },
      { state: 'FL', id: 'fl:614', name: 'I-4 @ MM 60.6 EB', url: 'https://fl511.com/map/Cctv/614', source: 'https://fl511.com' },
      { state: 'GA', id: 'ga:22445', name: 'Akers Mill Rd at Overton Park', url: 'https://511ga.org/map/Cctv/22445', source: 'https://511ga.org' },
      { state: 'ID', id: 'id:1', name: 'I-15 UT/ID State Line', url: 'https://511.idaho.gov/map/Cctv/1', source: 'https://511.idaho.gov' },
      { state: 'LA', id: 'la:1', name: 'I-20 at I-220 Off Ramp', url: 'https://511la.org/map/Cctv/1', videoUrl: 'https://ITSStreamingBR2.dotd.la.gov/public/shr-cam-007.streams/playlist.m3u8', source: 'https://511la.org' },
      { state: 'MD', id: 'md:7a00a1dc01250075004d823633235daa', name: 'I-270 & Old Hundred Rd', url: 'https://chart.maryland.gov/wwwroot/thumbnails/7a00a1dc01250075004d823633235daa.jpg', source: 'https://chart.maryland.gov' },
      { state: 'NC', id: 'nc:4768', name: 'WLM 19 17TH@DELANEY', url: 'https://www.drivenc.gov/map/Cctv/4768', source: 'https://drivenc.gov' },
      { state: 'NE', id: 'ne:950', name: 'Waterbury I-89 North', url: 'https://newengland511.org/map/Cctv/950', source: 'https://newengland511.org' },
      { state: 'NJ', id: 'nj:51', name: 'NJ-21 @ Murray Street', url: '', note: 'offline (Wink CDN blocked)', source: 'https://511nj.org' },
      { state: 'NV', id: 'nv:1', name: 'US-395 Reno', url: 'https://www.nvroads.com/map/Cctv/1', videoUrl: 'https://d2wse1.its.nv.gov:443/renoxcd02/976d8ebc-bf16-48dc-9aab-ecceddf97d3a_hspflirxcd02_public.stream/playlist.m3u8', source: 'https://nvroads.com' },
      { state: 'NY', id: 'ny:4436', name: 'NY 33 at NY 198 Interchange', url: 'https://511ny.org/map/Cctv/4436', videoUrl: 'https://s52.nysdot.skyvdn.com/rtplive/R5_013/playlist.m3u8', source: 'https://511ny.org' },
      { state: 'PA', id: 'pa:4765', name: 'I-76 (PA Turnpike)', url: 'https://www.511pa.com/map/Cctv/4765', source: 'https://511pa.com' },
      { state: 'SC', id: 'sc:e72041b8-d2a0-11e6-8996-0123456789ab', name: 'US 501 N @ Intracoastal', url: 'https://scdotsnap.us-east-1.skyvdn.com/thumbs/50016.flv.png', source: 'https://511sc.org' },
      { state: 'TN', id: 'tn:3165', name: 'I-40/75 @ West Hills', url: 'https://tnsnapshots.com/thumbs/R1_010.flv.png', source: 'https://smartway.tn.gov/traffic' },
      { state: 'UT', id: 'ut:136011', name: 'Minuteman Dr @ 12450 S', url: 'https://www.udottraffic.utah.gov/map/Cctv/136011', source: 'https://udottraffic.utah.gov' },
      { state: 'VA', id: 'va:3958', name: 'University Dr & Sager Ave', url: 'https://snapshot.vdotcameras.com/thumbs/0i6a7bfbs60yq2lbgivq0b8xk3scij3c.flv.png', source: 'https://511virginia.org' },
      { state: 'WI', id: 'wi:1089', name: 'I-90/94 at WIS 80', url: 'https://511wi.gov/map/Cctv/1089', videoUrl: 'https://cctv2.dot.wi.gov/rtplive/CCTV-29-0144/playlist.m3u8', source: 'https://511wi.gov' },
    ];

    const grid = document.getElementById('grid');
    const summary = document.getElementById('summary');
    let ok = 0, fail = 0, offline = 0;

    cameras.forEach(cam => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.state = cam.state;

      const isOffline = !cam.url || cam.note?.includes('offline');
      const isHls = cam.note?.includes('HLS');

      card.innerHTML = `
        <div class="card-header">
          <span class="card-state">${cam.state}</span>
          <span class="card-status ${isOffline ? 'offline' : 'loading'}" id="status-${cam.state}">
            ${isOffline ? 'OFFLINE' : 'CHECKING'}
          </span>
        </div>
        <div class="card-media">
        ${isOffline
          ? `<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:#666;font-size:0.7rem;">${cam.note || 'No URL'}</div>`
          : isHls
            ? `<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:#888;font-size:0.65rem;">HLS stream (no thumbnail)</div>`
            : `<img class="card-img" id="img-${cam.state}" src="${cam.url}" />`
        }
        </div>
        <div class="card-name"><a href="/roadie/view/${cam.state.toLowerCase()}?selected=${cam.id}" class="card-app-link">${cam.name}</a>${cam.source ? ` <a href="${cam.source}" target="_blank" class="card-source">source</a>` : ''}</div>
      `;
      grid.appendChild(card);

      if (isOffline) {
        offline++;
        updateSummary();
        return;
      }

      if (isHls) {
        fetch(cam.url, { method: 'HEAD' }).then(res => {
          const status = card.querySelector(`#status-${cam.state}`);
          if (res.ok) {
            status.textContent = 'OK';
            status.className = 'card-status ok';
            ok++;
          } else {
            status.textContent = 'FAIL';
            status.className = 'card-status fail';
            fail++;
          }
          updateSummary();
        }).catch(() => {
          const status = card.querySelector(`#status-${cam.state}`);
          status.textContent = 'FAIL';
          status.className = 'card-status fail';
          fail++;
          updateSummary();
        });
        return;
      }

      const img = card.querySelector(`#img-${cam.state}`);
      const status = card.querySelector(`#status-${cam.state}`);

      img.onload = () => {
        status.textContent = 'OK';
        status.className = 'card-status ok';
        ok++;
        updateSummary();
      };
      img.onerror = () => {
        status.textContent = 'FAIL';
        status.className = 'card-status fail';
        fail++;
        updateSummary();
      };
    });

    function updateSummary() {
      const active = cameras.length - offline;
      const checked = ok + fail;
      const ts = new Date().toLocaleTimeString();
      const offlineNote = offline > 0 ? ` (${offline} known offline)` : '';
      summary.innerHTML = `${ok}/${active} OK, ${fail}/${active} failed${offlineNote} <span class="ts">| ${ts}</span>`;

      const agg = document.getElementById('agg');
      if (checked < active) {
        agg.textContent = `${ok}/${active} OK`;
        agg.className = 'agg-badge checking';
      } else if (fail === 0) {
        agg.textContent = `All ${active} OK`;
        agg.className = 'agg-badge good';
      } else if (ok === 0) {
        agg.textContent = `All Down`;
        agg.className = 'agg-badge down';
      } else {
        agg.textContent = `${ok}/${active} OK`;
        agg.className = 'agg-badge degraded';
      }
    }
    let currentMode = 'image';
    const hlsInstances = [];

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeImg').className = mode === 'image' ? 'active' : '';
      document.getElementById('modeVid').className = mode === 'video' ? 'active' : '';

      // Destroy existing HLS instances
      hlsInstances.forEach(h => h.destroy());
      hlsInstances.length = 0;

      cameras.forEach(cam => {
        const card = grid.querySelector(`[data-state="${cam.state}"]`);
        if (!card) return;
        const mediaSlot = card.querySelector('.card-media');
        if (!mediaSlot) return;
        const isOffline = !cam.url || cam.note?.includes('offline');
        if (isOffline) return;

        if (mode === 'video') {
          if (cam.videoUrl) {
            const video = document.createElement('video');
            video.className = 'card-video';
            video.muted = true;
            video.autoplay = true;
            video.playsInline = true;
            mediaSlot.innerHTML = '';
            mediaSlot.appendChild(video);

            if (Hls.isSupported()) {
              const hls = new Hls({ maxBufferLength: 5, maxMaxBufferLength: 10 });
              hls.loadSource(cam.videoUrl);
              hls.attachMedia(video);
              hlsInstances.push(hls);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = cam.videoUrl;
            }
          } else {
            mediaSlot.innerHTML = `<div class="card-no-video">No video available</div>`;
          }
        } else {
          const isHls = cam.note?.includes('HLS');
          if (isHls) {
            mediaSlot.innerHTML = `<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:#888;font-size:0.65rem;">HLS stream (no thumbnail)</div>`;
          } else {
            mediaSlot.innerHTML = `<img class="card-img" src="${cam.url}?t=${Date.now()}" />`;
          }
        }
      });
    }
  </script>
</body>
</html>
