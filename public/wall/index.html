<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadie Wall - South Carolina</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #fff; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    h1 { font-size: 1.25rem; color: #e0e0e0; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.7rem; color: #888; margin-bottom: 1.5rem; }
    .wall-container {
      position: relative;
      width: min(90vw, 900px);
      aspect-ratio: 1.5 / 1;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }
    .wall-mosaic {
      display: grid;
      width: 100%;
      height: 100%;
      clip-path: url(#sc-outline);
    }
    .wall-mosaic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .wall-mosaic img.error { background: #222; }
    .stats { margin-top: 1rem; font-size: 0.65rem; color: #666; }
    .controls { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
    .controls button {
      background: #222; color: #888; border: 1px solid #333; border-radius: 4px;
      padding: 4px 10px; font-size: 0.65rem; cursor: pointer;
    }
    .controls button:hover { color: #fff; border-color: #555; }
  </style>
</head>
<body>
  <h1>South Carolina</h1>
  <p class="subtitle">760 cameras, live</p>

  <div class="wall-container">
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <clipPath id="sc-outline" clipPathUnits="objectBoundingBox">
          <path d="M0.05,0.15 L0.12,0.08 L0.18,0.05 L0.25,0.02 L0.32,0.0 L0.4,0.02 L0.48,0.08 L0.55,0.12 L0.6,0.18 L0.65,0.22 L0.7,0.28 L0.73,0.32 L0.78,0.38 L0.82,0.42 L0.86,0.48 L0.9,0.55 L0.93,0.6 L0.95,0.65 L0.97,0.72 L0.98,0.78 L1.0,0.85 L0.97,0.88 L0.92,0.9 L0.88,0.92 L0.82,0.95 L0.75,0.97 L0.68,0.98 L0.6,1.0 L0.52,0.98 L0.45,0.95 L0.38,0.92 L0.3,0.88 L0.22,0.82 L0.15,0.75 L0.1,0.68 L0.06,0.6 L0.04,0.52 L0.02,0.42 L0.01,0.35 L0.02,0.28 L0.03,0.22 Z" />
        </clipPath>
      </defs>
    </svg>

    <div class="wall-mosaic" id="wall"></div>
  </div>

  <p class="stats" id="stats">Loading cameras...</p>
  <div class="controls">
    <button id="btn-refresh">Refresh All</button>
  </div>

  <script>
    const META_URL = '/roadie/data/meta.json';
    const PINS_URL = '/roadie/data/pins.json';

    async function init() {
      const [pinsRes, metaRes] = await Promise.all([fetch(PINS_URL), fetch(META_URL)]);
      const pins = await pinsRes.json();
      const meta = await metaRes.json();

      const scPins = pins.filter(p => p[2].startsWith('sc:'));
      const wall = document.getElementById('wall');

      // Calculate grid: pack thumbnails into a grid that fills the container
      const count = scPins.length;
      const aspectRatio = 1.5; // container w/h ratio
      const cols = Math.ceil(Math.sqrt(count * aspectRatio));
      const rows = Math.ceil(count / cols);

      wall.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      wall.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

      let loaded = 0, failed = 0;

      scPins.forEach((pin) => {
        const [, , id] = pin;
        const cam = meta.cameras[id];
        const imgUrl = cam ? cam[3] : '';

        const img = document.createElement('img');
        img.loading = 'lazy';

        if (imgUrl) {
          img.src = imgUrl;
          img.onload = () => { loaded++; updateStats(); };
          img.onerror = () => { img.classList.add('error'); failed++; updateStats(); };
        } else {
          img.classList.add('error');
          failed++;
        }

        img.alt = cam ? cam[0] : id;
        wall.appendChild(img);
      });

      function updateStats() {
        document.getElementById('stats').textContent =
          `${loaded}/${count} loaded` + (failed ? `, ${failed} unavailable` : '');
      }
      updateStats();

      // Refresh
      document.getElementById('btn-refresh').addEventListener('click', () => {
        const imgs = wall.querySelectorAll('img');
        const t = Date.now();
        loaded = 0; failed = 0;
        imgs.forEach(img => {
          if (img.classList.contains('error') && !img.src) return;
          const base = img.src.split('?')[0];
          img.src = base + '?t=' + t;
          img.classList.remove('error');
        });
        updateStats();
      });
    }

    init();
  </script>
</body>
</html>
